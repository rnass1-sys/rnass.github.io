  <circle cx="650" cy="95" r="58" fill="#ffd447"/>
  <path d="M0 285 Q180 170 360 275 T800 235 V500 H0Z" fill="#79bd61"/>
  <path d="M0 350 Q190 260 390 350 T800 315 V500 H0Z" fill="#3f984f"/>
  <path d="M0 420 Q180 360 360 410 T800 390 V500 H0Z" fill="#247b43"/>
